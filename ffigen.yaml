# Regenerate with: dart run ffigen --config ffigen.yaml
name: LibDataChannel
description: Bindings to the libdatachannel C API (data channels only).
llvm-path:
  - /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib
output: lib/src/ffi/bindings.g.dart
headers:
  entry-points:
    - third_party/libdatachannel/include/rtc/rtc.h
  include-directives:
    - third_party/libdatachannel/include/rtc/rtc.h
compiler-opts:
  - -DRTC_ENABLE_MEDIA=0
  - -DRTC_ENABLE_WEBSOCKET=0
ffi-native:
  asset-id: package:dart_libp2p_webrtc/libdatachannel
preamble: |
  // ignore_for_file: type=lint
functions:
  include:
    - rtcInitLogger
    - rtcPreload
    - rtcCleanup
    - rtcCreatePeerConnection
    - rtcClosePeerConnection
    - rtcDeletePeerConnection
    - rtcSet(StateChange|IceStateChange|GatheringStateChange|SignalingStateChange|DataChannel)Callback
    - rtcSetLocalDescription
    - rtcSetRemoteDescription
    - rtcAddRemoteCandidate
    - rtcGet(Local|Remote)Description
    - rtcGet(Local|Remote)Address
    - rtcGetSelectedCandidatePair
    - rtcGetRemoteMaxMessageSize
    - rtcSet(Open|Closed|Error|BufferedAmountLow|Available)Callback
    - rtcSendMessage
    - rtcClose
    - rtcDelete
    - rtcIsOpen
    - rtcIsClosed
    - rtcMaxMessageSize
    - rtcGetBufferedAmount
    - rtcSetBufferedAmountLowThreshold
    - rtcGetAvailableAmount
    - rtcReceiveMessage
    - rtcCreateDataChannel
    - rtcCreateDataChannelEx
    - rtcDeleteDataChannel
    - rtcGetDataChannelStream
    - rtcGetDataChannelLabel
structs:
  include:
    - rtcConfiguration
    - rtcReliability
    - rtcDataChannelInit
enums:
  include:
    - rtcState
    - rtcIceState
    - rtcGatheringState
    - rtcSignalingState
    - rtcLogLevel
    - rtcCertificateType
    - rtcTransportPolicy
macros:
  include:
    - RTC_ERR_.*
typedefs:
  include:
    - rtc.*CallbackFunc
