# coturn with time-limited credentials (use-auth-secret), as doc/turn.md
# recommends for production, for test/turn_test.dart: shared secret
# test-secret, TURN over UDP and TCP on 3479, relay ports 49210-49230. No TLS.
listening-port=3479
min-port=49210
max-port=49230
realm=webrtc.test
use-auth-secret
static-auth-secret=test-secret
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
# Test peers run on the Docker host's private and loopback addresses.
allow-loopback-peers
log-file=stdout
