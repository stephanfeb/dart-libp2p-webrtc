# TURN servers for the fallback tests: docker compose -f docker/coturn/compose.yaml up -d
services:
  # Static user test/test.
  coturn:
    image: coturn/coturn:latest
    container_name: webrtc-test-coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
  # Time-limited credentials from the shared secret test-secret.
  coturn-secret:
    image: coturn/coturn:latest
    container_name: webrtc-test-coturn-secret
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver-secret.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3479:3479/udp"
      - "3479:3479/tcp"
      - "49210-49230:49210-49230/udp"
