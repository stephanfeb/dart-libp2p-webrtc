# coturn for the TURN fallback tests: long-term credentials test/test,
# TURN over UDP and TCP on 3478, relay ports 49160-49200. No TLS.
listening-port=3478
min-port=49160
max-port=49200
realm=webrtc.test
lt-cred-mech
user=test:test
fingerprint
no-tls
no-dtls
no-multicast-peers
# Test peers run on the Docker host's private and loopback addresses.
allow-loopback-peers
log-file=stdout
verbose
