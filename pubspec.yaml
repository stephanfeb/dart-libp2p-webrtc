name: dart_libp2p_webrtc
description: libp2p WebRTC (private-to-private) transport for dart-libp2p, built on libdatachannel via dart:ffi.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  code_assets: '>=1.0.0 <3.0.0'
  dart_libp2p: ^4.8.1
  ffi: ^2.2.0
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.26.0
