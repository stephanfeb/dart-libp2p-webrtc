name: dart_libp2p_webrtc
description: >-
  libp2p WebRTC transport (/webrtc) for dart-libp2p: Dart and Flutter apps and
  js-libp2p browsers connect directly, via libdatachannel and dart:ffi.
version: 0.1.0
repository: https://github.com/stephanfeb/dart-libp2p-webrtc
issue_tracker: https://github.com/stephanfeb/dart-libp2p-webrtc/issues
topics: [libp2p, webrtc, p2p, networking, ffi]

platforms:
  android:
  ios:
  linux:
  macos:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  dart_libp2p: ^4.9.0
  ffi: ^2.2.0
  hooks: '>=1.0.0 <3.0.0'
  logging: ^1.3.0

dev_dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.26.0
